<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK SPOTTER | 香港展覽 & Pop-up</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [spots, setSpots] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('全港');

      // 動態從 spots.json 讀取展覽資料
      useEffect(() => {
        fetch('./spots.json')
          .then(res => res.json())
          .then(data => setSpots(data))
          .catch(err => console.error("資料載入失敗:", err));
      }, []);

      const filteredSpots = spots.filter(spot => {
        const matchesSearch = spot.title.includes(searchQuery) || spot.venue.includes(searchQuery);
        const matchesRegion = selectedRegion === '全港' || spot.region === selectedRegion;
        return matchesSearch && matchesRegion;
      });

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <h1 className="text-xl font-bold tracking-wider text-cyan-400">HK SPOTTER</h1>
              <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">香港展覽 & Pop-up</span>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
              <input
                type="text"
                placeholder="搜尋展覽、地點..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
              <div className="flex gap-2">
                {['全港', '港島', '九龍', '新界'].map(region => (
                  <button
                    key={region}
                    onClick={() => setSelectedRegion(region)}
                    className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                      selectedRegion === region
                        ? 'bg-cyan-500 text-white'
                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {region}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid gap-4 md:grid-cols-2">
              {filteredSpots.map(spot => (
                <div key={spot.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                  <img src={spot.image} alt={spot.title} className="h-48 w-full object-cover" />
                  <div className="p-4 flex-1 flex flex-col justify-between space-y-2">
                    <div>
                      <div className="flex justify-between items-start">
                        <h2 className="text-lg font-bold text-gray-800">{spot.title}</h2>
                        {spot.isHot && (
                          <span className="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">HOT</span>
                        )}
                      </div>
                      <p className="text-sm text-cyan-600 font-medium">{spot.venue}</p>
                      <p className="text-xs text-gray-500 mt-1">{spot.description}</p>
                    </div>
                    <div className="pt-2 border-t border-gray-50 text-xs text-gray-400 space-y-1">
                      <p>📍 {spot.address}</p>
                      <p>🚇 {spot.transport}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
