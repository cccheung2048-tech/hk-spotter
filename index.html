<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK SPOTTER | 香港展覽 & Pop-up</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body className="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [spots, setSpots] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('全港');
      const [showInstallTip, setShowInstallTip] = useState(false);

      useEffect(() => {
        fetch('./spots.json')
          .then(res => res.json())
          .then(data => setSpots(data))
          .catch(err => console.error("資料載入失敗:", err));
      }, []);

      const filteredSpots = spots.filter(spot => {
        const matchesSearch = spot.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              spot.venue.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesRegion = selectedRegion === '全港' || spot.region === selectedRegion;
        return matchesSearch && matchesRegion;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
          <header className="bg-slate-950 p-4 shadow-md sticky top-0 z-50 border-b border-slate-800">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <h1 className="text-xl font-bold tracking-wider text-cyan-400">HK SPOTTER</h1>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowInstallTip(true)}
                  className="text-xs bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2.5 py-1.5 rounded-lg font-medium hover:bg-cyan-500/30 transition"
                >
                  📱 加入主畫面
                </button>
                <span className="text-xs bg-slate-800 px-2 py-1.5 rounded text-slate-300 border border-slate-700 hidden sm:inline">香港展覽</span>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
            {/* 安裝提示彈窗 */}
            {showInstallTip && (
              <div className="bg-slate-800 border border-cyan-500/50 p-4 rounded-xl shadow-xl space-y-3 relative">
                <button 
                  onClick={() => setShowInstallTip(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <h3 className="font-bold text-cyan-400 text-sm">📲 如何將 HK SPOTTER 加入手機桌面？</h3>
                <div className="text-xs text-slate-300 space-y-2">
                  <p><strong>蘋果 iPhone (Safari 瀏覽器)：</strong><br/>點擊下方工具列的「分享」按鈕 ⎋，然後選擇 <strong>「加入主畫面」</strong>。</p>
                  <p><strong>Android (Chrome 瀏覽器)：</strong><br/>點擊右上角的選單 ⋮，然後選擇 <strong>「加到主畫面」</strong> 或 <strong>「安裝應用程式」</strong>。</p>
                </div>
              </div>
            )}

            {/* 搜尋與篩選區塊 */}
            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow-lg">
              <input
                type="text"
                placeholder="搜尋展覽、地點..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
              <div className="flex gap-2">
                {['全港', '港島', '九龍', '新界'].map(region => (
                  <button
                    key={region}
                    onClick={() => setSelectedRegion(region)}
                    className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                      selectedRegion === region
                        ? 'bg-cyan-500 text-white font-bold'
                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                    }`}
                  >
                    {region}
                  </button>
                ))}
              </div>
            </div>

            {/* 卡片列表 */}
            <div className="grid gap-4 md:grid-cols-2">
              {filteredSpots.map(spot => (
                <div key={spot.id} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden flex flex-col shadow-md hover:border-slate-600 transition">
                  <img 
                    src={spot.image} 
                    alt={spot.title} 
                    className="h-48 w-full object-cover bg-slate-900"
                    onError={(e) => {
                      e.target.onerror = null; 
                      e.target.src = 'https://images.unsplash.com/photo-1518998053901-5348d3961a04?auto=format&fit=crop&w=800&q=80';
                    }}
                  />
                  <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                      <div className="flex justify-between items-start gap-2">
                        <h2 className="text-lg font-bold text-white leading-snug">{spot.title}</h2>
                        {spot.isHot && (
                          <span className="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold shrink-0">HOT</span>
                        )}
                      </div>
                      <p className="text-sm text-cyan-400 font-medium mt-1">{spot.venue}</p>
                      
                      <div className="mt-2 space-y-1 text-xs bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 text-slate-300">
                        <p>📅 <span className="text-white">{spot.date}</span></p>
                        <p>🕒 <span className="text-white">{spot.time}</span></p>
                        <p>💰 <span className="text-emerald-400 font-semibold">{spot.price}</span></p>
                      </div>

                      <p className="text-xs text-slate-400 mt-2 line-clamp-2">{spot.description}</p>
                    </div>

                    <div className="pt-2 border-t border-slate-700 text-xs text-slate-400 space-y-1">
                      <p>📍 {spot.address}</p>
                      <p>🚇 {spot.transport}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
