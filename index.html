<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK SPOTTER | 香港展覽 & Pop-up</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MOCK_SPOTS = [
      {
        id: '1',
        title: 'teamLab 沉浸展',
        venue: 'teamLab Megabox',
        category: '商場',
        region: '九龍',
        isHot: true,
        address: '九龍灣 Megabox',
        transport: '港鐵九龍灣站 A 出口步行 8 分鐘',
        description: 'Megabox 期間限定沉浸式數碼藝術互動空間，光影裝置與無限反射房間。',
        image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: '2',
        title: '香港當代藝術展',
        venue: 'M+ 博物館 / 西九文化區',
        category: '展覽',
        region: '九龍',
        isHot: false,
        address: '西九文化區 M+ 博物館',
        transport: '港鐵九龍站 E4 出口步行 10 分鐘',
        description: '展出多位本地及國際當代藝術家作品，涵蓋視覺藝術、設計與建築。',
        image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80'
      }
    ];

    function App() {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('全港');

      const filteredSpots = MOCK_SPOTS.filter(spot => {
        const matchesSearch = spot.title.includes(searchQuery) || spot.venue.includes(searchQuery);
        const matchesRegion = selectedRegion === '全港' || spot.region === selectedRegion;
        return matchesSearch && matchesRegion;
      });

      return (
        <div class="min-h-screen flex flex-col">
          <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
              <h1 class="text-xl font-bold tracking-wider text-cyan-400">HK SPOTTER</h1>
              <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">香港展覽 & Pop-up</span>
            </div>
          </header>

          <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
              <input
                type="text"
                placeholder="搜尋展覽、地點..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
              <div class="flex gap-2">
                {['全港', '港島', '九龍', '新界'].map(region => (
                  <button
                    key={region}
                    onClick={() => setSelectedRegion(region)}
                    class={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                      selectedRegion === region
                        ? 'bg-cyan-500 text-white'
                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {region}
                  </button>
                ))}
              </div>
            </div>

            <div class="grid gap-4 md:grid-cols-2">
              {filteredSpots.map(spot => (
                <div key={spot.id} class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                  <img src={spot.image} alt={spot.title} class="h-48 w-full object-cover" />
                  <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                    <div>
                      <div class="flex justify-between items-start">
                        <h2 class="text-lg font-bold text-gray-800">{spot.title}</h2>
                        {spot.isHot && (
                          <span class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">HOT</span>
                        )}
                      </div>
                      <p class="text-sm text-cyan-600 font-medium">{spot.venue}</p>
                      <p class="text-xs text-gray-500 mt-1">{spot.description}</p>
                    </div>
                    <div class="pt-2 border-t border-gray-50 text-xs text-gray-400 space-y-1">
                      <p>📍 {spot.address}</p>
                      <p>🚇 {spot.transport}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
